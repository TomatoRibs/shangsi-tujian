<!DOCTYPE html>
<html data-page-node-id="VKIP6PobRJMzfLAgMppfOS" lang="zh-CN">
<head data-page-node-id="471Zbp9lhvJLftRId1O0yw">
<script data-page-node-id="6lDhTHg0b9x1HWmBTfpkl0" src="/page/page_comm/inject.js"></script>
<meta data-page-node-id="Fb3kgulV5YTlIPsDvK3gjq" charset="utf-8">

<title data-page-node-id="njq7Y5goQPFLuZvFixjtjg" data-pnid-children="pzeP788mpidxi7zTDANs6H">上司图鉴 · 十题出一份鉴定报告</title>
<style data-page-node-id="HimE0jkWwsrQMa2qDlQsgK" data-pnid-children="UuZ7olGDa7qIVTHYLb0oe6">
  :root{
    --paper:#FCFAF6;
    --paper-2:#F2EEE5;
    --ink:#26241F;
    --ink-2:#5B554A;
    --ink-3:#8D8676;
    --rule:#E6E0D3;
    --accent:#BE3A2B;
    --safe:#2F7A57;
    --warn:#C98A1E;
    --serif:"Noto Serif SC","Songti SC",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(900px 520px at 14% -5%, rgba(190,58,43,.06), transparent 60%),
      radial-gradient(820px 500px at 92% 105%, rgba(47,122,87,.05), transparent 60%),
      linear-gradient(180deg,#F1EDE4 0%,#E8E2D6 100%);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;gap:13px;
  }
  /* ============ 报告卡 ============ */
  .card{
    width:min(1060px,96vw);
    height:min(880px,calc(100dvh - 44px));
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 30px 70px rgba(74,66,52,.20),0 1px 0 rgba(255,255,255,.75) inset;
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
  }
  .c-band{flex:none;height:6px;background:var(--ink-3)}
  .c-band.high{background:var(--accent)}
  .c-band.mid{background:var(--warn)}
  .c-band.low{background:var(--safe)}
  .c-head{
    flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:0 24px;border-bottom:1px solid var(--rule);
    font-size:13px;color:var(--ink-3);letter-spacing:.02em;
    background:linear-gradient(#FDFCF9,#F5F1E9);
  }
  .c-head .brand{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink);letter-spacing:.06em;white-space:nowrap}
  .c-head .code{font-variant-numeric:tabular-nums;letter-spacing:.08em;white-space:nowrap}
  .c-head .priv{white-space:nowrap;color:#7D7668}
  .c-body{
    flex:1;min-height:0;overflow:hidden;
    padding:20px 34px 12px;
    font-size:clamp(13px,1.4vh,15px);
    display:flex;flex-direction:column;
  }
  .c-foot{
    flex:none;border-top:1px solid var(--rule);
    padding:13px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:linear-gradient(#F4F1EA,#FBFAF7);
  }
  .c-foot .note{font-size:12px;color:var(--ink-3);margin-right:auto}
  .c-foot input{
    flex:1;min-width:170px;max-width:290px;font:inherit;font-size:12.5px;
    padding:8px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink-2);border-radius:7px;
  }
  .btn{
    font:inherit;font-size:14px;padding:11px 26px;background:var(--ink);color:var(--paper);
    border:none;border-radius:8px;cursor:pointer;transition:transform .12s,opacity .12s;letter-spacing:.02em;
  }
  .btn:hover{opacity:.88;transform:translateY(-1px)}
  .btn:disabled{background:var(--paper-2);color:var(--ink-3);cursor:not-allowed;transform:none}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
  .btn-ghost:hover{background:var(--paper-2);opacity:1}
  .mini{
    font:inherit;font-size:12px;padding:6px 14px;background:transparent;color:var(--ink-2);
    border:1px solid var(--rule);border-radius:6px;cursor:pointer;
  }
  .mini:hover{background:var(--paper-2);color:var(--ink)}
  .stage-note{font-size:12px;color:#8D8676;letter-spacing:.04em}
  .stage-note b{color:#6E685C;font-weight:600}

  /* ============ 开场 ============ */
  .intro{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
  .intro-l{min-width:0}
  .kicker{font-size:13px;letter-spacing:.22em;color:var(--accent);margin-bottom:12px}
  .intro h1{font-family:var(--serif);font-weight:600;font-size:clamp(40px,6.2vh,60px);line-height:1.16;margin-bottom:16px;letter-spacing:.01em}
  .lede{font-size:1.12em;line-height:1.88;color:var(--ink-2);margin-bottom:24px;max-width:27em}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}
  .chips span{font-size:13px;color:var(--ink-2);border:1px solid var(--rule);padding:6px 14px;border-radius:20px;background:#fff}
  .intro .btn{font-size:15px;padding:14px 38px}
  /* 开场页：认领上级（命名前置，打开即可见） */
  .claim{margin:0 0 16px;padding:12px 15px;background:var(--paper-2);border:1px solid var(--rule);border-radius:12px}
  .claim-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .claim-h b{font-family:var(--serif);font-size:1.02em;font-weight:600;color:var(--ink)}
  .claim-h span{font-size:11.5px;color:var(--ink-3)}
  .claim input{width:100%;font:inherit;font-size:13.5px;padding:8px 12px;border:1px solid var(--rule);border-radius:9px;background:#fff;color:var(--ink);margin-bottom:8px}
  .claim input:focus{outline:none;border-color:var(--accent)}
  .claim input::placeholder{color:var(--ink-3)}
  .claim .nicks{gap:5px 6px}
  .fine{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:16px}
  .dexwrap{margin-top:20px}
  .dexwrap .dl{font-size:12px;color:var(--ink-3);margin-bottom:10px;display:flex;justify-content:space-between;letter-spacing:.04em}
  .dex{display:flex;flex-wrap:wrap;gap:7px}
  .dex span{font-size:12px;color:var(--ink-3);border:1px solid var(--rule);padding:5px 12px;border-radius:20px;background:var(--paper)}
  .dex span.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
  .irl{font-size:12.5px;color:var(--ink-3);margin-bottom:14px;letter-spacing:.06em}
  .mini-card{
    background:#fff;border:1px solid var(--rule);border-radius:14px;padding:26px 26px 22px;
    box-shadow:0 26px 56px rgba(27,26,23,.15);transform:rotate(-1.1deg);
  }
  .mc-chip{display:inline-block;font-size:12px;letter-spacing:.14em;color:#fff;background:var(--accent);padding:4px 10px;border-radius:3px}
  .mc-name{font-family:var(--serif);font-size:32px;font-weight:600;margin:13px 0 7px;line-height:1.15}
  .mc-roast{font-family:var(--serif);font-size:13.5px;line-height:1.75;color:var(--ink-2);margin-bottom:16px}
  .mc-bp{display:flex;align-items:baseline;gap:10px}
  .mc-bp b{font-family:var(--serif);font-size:38px;font-weight:600;color:var(--accent);line-height:1}
  .mc-bp span{font-size:12px;color:#fff;background:var(--accent);padding:3px 9px;border-radius:3px}
  .mc-bar{height:9px;background:var(--paper-2);border-radius:5px;overflow:hidden;margin:13px 0 9px}
  .mc-bar i{display:block;height:100%;width:75%;background:var(--accent);border-radius:5px}
  .mc-st{font-size:12.5px;color:var(--ink-3)}
  .mc-axes{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:grid;gap:8px}
  .mc-axis{display:grid;grid-template-columns:4.8em 1fr 2.2em;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-3)}
  .mc-axis u{display:block;height:5px;border-radius:3px;background:var(--paper-2);overflow:hidden;text-decoration:none}
  .mc-axis u b{display:block;height:100%;background:var(--accent);border-radius:3px}
  .mc-axis em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
  .mc-say{margin-top:14px;padding:10px 13px;background:var(--paper-2);border-radius:8px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
  .mc-say b{color:var(--ink);font-weight:600}
  @media (max-width:900px){ .intro{grid-template-columns:1fr;gap:26px} .mini-card{transform:none} }

  /* ============ 答题 ============ */
  .qwrap{flex:1;min-height:0;display:flex;flex-direction:column}
  .qtop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .qno{font-size:13px;color:var(--ink-3);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .qpct{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .prog{height:5px;background:var(--paper-2);border-radius:5px;overflow:hidden;margin-bottom:30px}
  .prog i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .3s ease}
  .qtitle{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.3vh,31px);line-height:1.44;margin-bottom:10px}
  .qhint{font-size:.94em;color:var(--ink-3);margin-bottom:26px}
  .opts{display:flex;flex-direction:column}
  .opt{
    display:flex;gap:14px;align-items:flex-start;padding:17px 8px;
    border-top:1px solid var(--rule);cursor:pointer;transition:background .12s;
  }
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{background:var(--paper-2)}
  .opt.is-on{background:var(--paper-2)}
  .opt .box{
    flex:none;width:16px;height:16px;margin-top:3px;border:1.5px solid var(--ink-3);border-radius:50%;position:relative;
    transition:border-color .14s;
  }
  .opt:hover .box{border-color:var(--ink-2)}
  .opt.is-on .box{border-color:var(--accent)}
  .opt.is-on .box::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent)}
  .opt .t{font-size:1.02em;line-height:1.6;color:var(--ink-2)}
  .opt:hover .t,.opt.is-on .t{color:var(--ink)}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:20px}

  /* ============ 结果：海报式报告 ============ */
  .r-wrap{display:flex;flex-direction:column;flex:1}
  .r-hero{display:grid;grid-template-columns:1.6fr 1fr;gap:30px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .r-hero-l{min-width:0}
  .chip{
    display:inline-block;font-size:11.5px;letter-spacing:.16em;color:#fff;background:var(--accent);
    padding:5px 11px;border-radius:4px;margin-bottom:10px;
  }
  .chip.mid{background:var(--warn)}.chip.low{background:var(--safe)}
  .rname{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vh,44px);line-height:1.14;margin-bottom:5px;letter-spacing:.01em}
  /* 主视觉：上级名字最醒目 */
  .objlbl{font-size:11px;letter-spacing:.24em;color:var(--accent);font-weight:600;margin-bottom:1px}
  .bossname{
    font-family:var(--serif);font-weight:700;font-size:clamp(38px,6vh,60px);
    line-height:1.05;letter-spacing:.01em;color:var(--ink);margin-bottom:7px;word-break:break-word;
  }
  .bossname.none{color:var(--ink-3);font-size:clamp(28px,4vh,40px)}
  .typerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .tname{font-family:var(--serif);font-weight:600;font-size:clamp(18px,2.4vh,25px);color:var(--accent)}
  .ttag{font-size:.85em;color:var(--ink-3)}
  .rtag{font-size:.9em;color:var(--ink-3);margin-bottom:10px}
  .roast{font-family:var(--serif);font-weight:600;font-size:clamp(15px,2vh,20px);line-height:1.52;color:var(--ink)}
  .r-hero-r{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .bp{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:4px}
  .bp-num{font-family:var(--serif);font-weight:600;font-size:clamp(44px,6.6vh,64px);line-height:1;letter-spacing:-.01em}
  .bp-num span{font-size:.3em;color:var(--ink-3);font-weight:400;margin-left:2px;letter-spacing:0}
  .bp-num.high{color:var(--accent)}
  .bp-num.mid{color:var(--warn)}
  .bp-num.low{color:var(--safe)}
  .lv{font-size:12px;padding:5px 11px;border-radius:4px;color:#fff;white-space:nowrap}
  .lv.high{background:var(--accent)}.lv.mid{background:var(--warn)}.lv.low{background:var(--safe)}
  .dbar{height:12px;background:var(--paper-2);border-radius:7px;overflow:hidden;margin:8px 0 12px}
  .dbar i{display:block;height:100%;border-radius:7px}
  .dbar i.high{background:var(--accent)}.dbar i.mid{background:var(--warn)}.dbar i.low{background:var(--safe)}
  .stats{display:flex;gap:24px;flex-wrap:wrap}
  .stats b{display:block;font-family:var(--serif);font-size:1.55em;font-weight:600;line-height:1.15}
  .stats b i{font-style:normal;font-size:.55em;color:var(--ink-3);margin-left:2px;font-family:var(--sans)}
  .stats span{display:block;font-size:.82em;color:var(--ink-3);margin-top:1px}

  .r-mid{display:grid;grid-template-columns:1.35fr 1fr;gap:30px;padding:12px 0;border-bottom:1px solid var(--rule)}
  .r-mid-l,.r-mid-r{min-width:0}
  .rdesc{font-size:.95em;line-height:1.7;color:var(--ink-2);margin-bottom:10px}
  .sec{font-family:var(--serif);font-size:1.02em;font-weight:600;margin-bottom:8px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .sec em{font-style:normal;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:.02em}
  .axis{display:grid;grid-template-columns:5.6em 1fr 2.6em;align-items:center;gap:11px;margin-bottom:7px}
  .axis .lab{font-size:.9em;color:var(--ink-2)}
  .axis .track{display:block;height:9px;background:var(--paper-2);border-radius:5px;overflow:hidden}
  .axis .fill{display:block;height:100%;border-radius:5px}
  .axis .fill.good{background:var(--safe)}.axis .fill.warn{background:var(--warn)}.axis .fill.bad{background:var(--accent)}
  .axis .val{font-size:.86em;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .axis .val.good{color:var(--safe)}.axis .val.warn{color:var(--warn)}.axis .val.bad{color:var(--accent)}

  .saylbl{font-size:.84em;color:var(--ink-3);margin:0 0 4px;letter-spacing:.04em}
  .say{font-family:var(--serif);font-weight:600;font-size:1.2em;line-height:1.5;margin-bottom:10px}
  .inner{font-family:var(--serif);font-size:1.1em;line-height:1.55;color:var(--ink-2);margin-bottom:10px}
  .line{margin:0;padding:10px 13px;background:var(--paper-2);border-radius:8px;font-size:.94em;line-height:1.66;color:var(--ink)}
  .copyrow{display:flex;justify-content:flex-end;margin-top:6px}

  .r-low{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding-top:12px}
  .r-low-l,.r-low-r{min-width:0}
  .vent{list-style:none;margin:0;padding:0}
  .vent li{
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    font-size:.92em;line-height:1.6;color:var(--ink-2);padding:7px 0;border-top:1px solid var(--rule);cursor:pointer;
  }
  .vent li:hover{color:var(--ink)}
  .vent li .cp{flex:none;font-size:12px;color:var(--ink-3)}
  .vent li:hover .cp{color:var(--accent)}
  .tip,.kit{list-style:none;margin:0;padding:0}
  .tip li,.kit li{font-size:.9em;line-height:1.6;color:var(--ink-2);padding:5px 0;border-top:1px solid var(--rule);display:flex;gap:9px}
  .tip li::before,.kit li::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--accent)}
  .kit li::before{background:var(--ink-3)}
  .verdict{font-size:.9em;line-height:1.66;color:var(--ink);margin-top:9px;padding:8px 12px;background:var(--paper-2);border-radius:8px}
  .concl{
    display:flex;align-items:center;gap:12px;
    font-size:clamp(13px,1.55vh,15px);line-height:1.55;font-weight:600;color:#fff;
    padding:8px 15px;border-radius:8px;margin-bottom:10px;
  }
  .concl.high{background:var(--accent)}
  .concl.mid{background:var(--warn)}
  .concl.low{background:var(--safe)}
  .concl .tagline{font-size:.82em;font-weight:400;opacity:.92}
  /* 外号按钮（命名屏共用） */
  .nicks{display:flex;flex-wrap:wrap;gap:5px 6px}
  .nicks button{
    flex:none;font:inherit;font-size:11.5px;padding:4px 10px;border-radius:20px;cursor:pointer;white-space:nowrap;
    border:1px dashed var(--rule);background:transparent;color:var(--ink-2);transition:all .12s;
  }
  .nicks button:hover,.nicks button.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:#fff}
  .future{font-size:.9em;line-height:1.62;color:var(--ink-2);margin-top:7px;padding-left:12px;border-left:2px solid var(--rule)}
  .future b{color:var(--accent);font-weight:600}

  /* ============ 命名：第 10 题之后的独立窗口 ============ */
  .namewrap{
    flex:1;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:4px 0;
  }
  .nlede{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(22px,3.2vh,30px);line-height:1.45;color:var(--ink);
    margin-bottom:26px;
  }
  .ninput{
    width:min(420px,86%);font-family:var(--serif);font-weight:600;
    font-size:clamp(20px,2.8vh,26px);text-align:center;
    padding:11px 18px;border:1px solid var(--rule);border-radius:11px;
    background:#fff;color:var(--ink);margin-bottom:24px;transition:border-color .16s;
  }
  .ninput:focus{outline:none;border-color:var(--accent)}
  .ninput::placeholder{color:var(--ink-3);font-family:var(--sans);font-weight:400;font-size:.56em}
  .nnicks{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
    gap:8px;width:min(760px,100%);margin:0 0 28px;flex:none;
  }
  .nnicks button{
    height:auto;font:inherit;font-size:12px;line-height:1.3;
    padding:9px 6px;border-radius:9px;cursor:pointer;white-space:nowrap;
    border:1px solid var(--rule);background:transparent;color:var(--ink-2);
    transition:all .12s;
  }
  .nnicks button:hover,.nnicks button.on{border-color:var(--accent);color:var(--accent);background:#fff}
  .nact{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .nskip{font:inherit;font-size:13px;padding:6px 4px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .nskip:hover{color:var(--ink)}

  @media (max-width:900px){
    .card{height:auto;min-height:calc(100dvh - 74px)}
    .r-hero,.r-mid,.r-low{grid-template-columns:1fr;gap:16px}
    .c-body{overflow:visible}
  }
</style>
</head>

/* 兜底：任何一屏内容超出卡片时整体等比缩小，保证任何分辨率都不出现滚动条、也不裁切 */
function fitScreen(){
  const body = document.getElementById('main');
  const el = body && body.firstElementChild;
  if(!el) return;
  el.style.transform = 'none';
  el.style.width = '';
  el.style.marginBottom = '0px';
  const avail = body.clientHeight - 2;
  const need = el.scrollHeight;
  if(need > avail && avail > 0){
    const k = avail / need;
    el.style.transformOrigin = 'top left';
    el.style.transform = 'scale(' + k.toFixed(4) + ')';
    el.style.width = (100 / k).toFixed(3) + '%';
    el.style.marginBottom = '-' + Math.round(need - avail) + 'px';
  }
}
function fitAfter(){ fitScreen(); requestAnimationFrame(fitScreen); }

      '<span class="note">全程在本机计算，不上传、不发任何请求</span>'+
      (withBtn ? '<button class="btn btn-ghost" id="quitBtn" style="padding:8px 18px;font-size:13px">'+lbl+'</button>' : '');
    if(kind==="quiz"){
      document.getElementById('quitBtn').onclick = () => { state.screen="intro"; render(); };
    } else if(kind==="name"){
      document.getElementById('quitBtn').onclick = () => { state.screen="quiz"; state.qi=QUESTIONS.length-1; render(); };
    }
  }
}
function flash(btn,t){ if(!btn) return; const o=btn.textContent; btn.textContent=t; setTimeout(()=>{btn.textContent=o;},1200); }

/* ===================== Canvas 手绘竖版海报（零依赖，带编号/日期/裂变文案） ===================== */
const POSTER_W = 1080;
function posterData(){
  const s = computeScores();
  const type = classify(s);
  const d = dangerScore(s);
  const dv = Math.round(d);
  const tier = d>=64 ? TIERS.high : (d>=34 ? TIERS.mid : TIERS.low);
  const hoursWeek = Math.round((d/100*11)*10)/10;
  const daysYear = Math.round(hoursWeek*48/8);
  return {s,type,dv,tier,hoursWeek,daysYear};
}
function rr(x,X,Y,W,H,R){
  x.beginPath(); x.moveTo(X+R,Y);
  x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R);
  x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath();
}
function wrapLines(x,text,maxW){
  const out=[]; let cur='';
  for(const ch of String(text)){
    if(cur && x.measureText(cur+ch).width>maxW){ out.push(cur); cur=ch; }
    else cur+=ch;
  }
  if(cur) out.push(cur);
  return out;
}

    x.fillStyle = C.paper; x.fillRect(0,0,W,c.height);

    // 纸纹噪点（确定性分布，每次导出一致）

      x.fillRect((i*97.13)%W, (i*53.77)%c.height, 2, 2);
    }
    x.restore();

    const now = new Date();
    const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    let y = 78;

function computeScores(){
  const s = {A:0,R:0,E:0,D:0};
  state.answers.forEach((a,qi)=>{
    if(a===null) return;
    const w = QUESTIONS[qi].opts[a].w;
    s.A+=w[0]; s.R+=w[1]; s.E+=w[2]; s.D+=w[3];
  });
  AXES.forEach(ax=>{ s[ax.k] = Math.round(Math.min(100, s[ax.k]/MAX[ax.k]*100)); });
  return s;
}

function classify(s){
  const {A,R,E,D}=s;
  const T=k=>TYPES.find(t=>t.key===k);
  if(E<=50 && (A>=55 || D>=55)) return T('volcano');
  if(R<=28 && A<58) return T('passer');
  if(A<=40 && D<=35 && R<=45) return T('ghost');
  if(D<=35 && R<=45 && E>=55) return T('chameleon');
  if(D<=35 && A<=55 && R>=30) return T('promiser');
  if(R<=45 && A>=55 && D>=45 && E>=55) return T('harvester');
  if(A>=65 && R>=40 && D<60 && E>=55) return T('microscope');
  if(A>=60 && R>=60 && D>=60) return T('ironhand');
  let best=null,bd=Infinity;
  TYPES.forEach(t=>{const d=Math.pow(A-t.c[0],2)+Math.pow(R-t.c[1],2)+Math.pow(E-t.c[2],2)+Math.pow(D-t.c[3],2); if(d<bd){bd=d;best=t;}});
  return best;
}

function renderResult(){
  const s = computeScores();
  const type = classify(s);
  const d = dangerScore(s);
  const dv = Math.round(d);
  const tier = d>=64 ? TIERS.high : (d>=34 ? TIERS.mid : TIERS.low);
  const hoursWeek = Math.round((d/100*11)*10)/10;
  const daysYear = Math.round(hoursWeek*48/8);
  saveDex(type.key);
  setCode("SX-"+String(dv).padStart(4,'0'));
  setBand(tier.cls);
  renderFoot("result");
  if(!state.boss) state.boss = loadBoss();

  let axes = '';
  AXES.forEach(ax=>{
    const v = s[ax.k];
    let tone;
    if(ax.k==='A'){ tone = v>=65 ? 'bad' : (v>=40 ? 'warn' : 'good'); }
    else { tone = v>=60 ? 'good' : (v>=35 ? 'warn' : 'bad'); }
    axes += '<div class="axis"><span class="lab">'+ax.name+'</span>'+
      '<span class="track"><span class="fill '+tone+'" style="width:'+v+'%"></span></span>'+
      '<span class="val '+tone+'">'+v+'</span></div>';
  });
  let tips = '';
  type.tips.slice(0,2).forEach(t=>{ tips += '<li>'+esc(t)+'</li>'; });
  tier.kit.slice(0,2).forEach(k=>{ tips += '<li>'+esc(k)+'</li>'; });
  let vent = '';
  type.vent.forEach(v=>{ vent += '<li data-t="'+esc(v)+'"><span>'+esc(v)+'</span><span class="cp">点一下复制</span></li>'; });

  document.getElementById('main').innerHTML =
    '<div class="r-wrap">'+
      '<div class="concl '+tier.cls+'"><span>'+esc(tier.conclusion)+'</span><span class="tagline">'+esc(tier.sub)+'</span></div>'+
      '<section class="r-hero">'+
        '<div class="r-hero-l">'+
          '<span class="chip '+tier.cls+'">上级鉴定报告</span>'+
          '<p class="objlbl">鉴定对象</p>'+
          '<h2 class="bossname'+(state.boss.trim()?'':' none')+'" data-bossname>'+(state.boss.trim()?esc(state.boss.trim()):'你的上级')+'</h2>'+
          '<div class="typerow"><span class="tname">'+esc(type.name)+'</span><span class="ttag">'+esc(type.tag)+'</span></div>'+
          '<p class="roast">「'+esc(type.roast)+'」</p>'+
        '</div>'+
        '<div class="r-hero-r">'+
          '<div class="bp"><span class="bp-num '+tier.cls+'">'+dv+'<span>/100</span></span><span class="lv '+tier.cls+'">'+tier.label+'</span></div>'+
          '<div class="dbar"><i class="'+tier.cls+'" style="width:'+dv+'%"></i></div>'+
          '<div class="stats">'+
            '<div><b>'+hoursWeek+'<i>小时</i></b><span>每周为他额外消耗</span></div>'+
            '<div><b>'+daysYear+'<i>天</i></b><span>一年折合的工作日</span></div>'+
          '</div>'+
        '</div>'+
      '</section>'+
      '<section class="r-mid">'+
        '<div class="r-mid-l">'+
          '<p class="rdesc">'+esc(type.desc)+'</p>'+
          '<h3 class="sec">四维行为轴 <em>控制倾向越高越压人；其余三项越高越好</em></h3>'+
          axes+
        '</div>'+
        '<div class="r-mid-r">'+
          '<h3 class="sec">他说 · 你回</h3>'+
          '<p class="saylbl">他嘴里最常出现的那句</p>'+
          '<p class="say">「'+esc(type.say)+'」</p>'+
          '<p class="saylbl">你心里其实想回的那句</p>'+
          '<p class="inner">「'+esc(type.inner)+'」</p>'+
          '<p class="saylbl">下次见面，可以这么说</p>'+
          '<p class="line">'+esc(type.line)+'</p>'+
          '<div class="copyrow"><button class="mini" id="copyLine">复制这句</button></div>'+
        '</div>'+
      '</section>'+
      '<section class="r-low">'+
        '<div class="r-low-l">'+
          '<h3 class="sec">你已经忍了很久了 <em>点一下复制，发群里</em></h3>'+
          '<ul class="vent">'+vent+'</ul>'+
          '<p class="verdict">'+esc(tier.verdict)+'</p>'+
          '<p class="future"><b>三年推演 · </b>'+esc(type.future)+'</p>'+
        '</div>'+
        '<div class="r-low-r">'+
          '<h3 class="sec">保命清单 <em>性格两条 · 档位两条</em></h3>'+
          '<ul class="tip">'+tips+'</ul>'+
        '</div>'+
      '</section>'+
    '</div>';

  const m = document.getElementById('main');
  fitAfter();
  document.getElementById('copyLine').onclick = (e) => copy(type.line, e.currentTarget);
  m.querySelectorAll('.vent li').forEach(li=>{
    li.onclick = () => copy(li.getAttribute('data-t'), li.querySelector('.cp'));
  });

  function copy(text, btn){
    const done = () => flash(btn,'已复制');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
    else done();
  }
}

/* ===================== 分享：选项编码进 URL hash ===================== */
function writeHash(){
  const code = state.answers.map(a=>a===null?0:a).join('');
  try{ location.hash = 'r=' + btoa(code); }catch(e){ location.hash = 'r=' + code; }
}
function readHash(){
  const h = location.hash || '';
  const m = h.match(/r=([0-9A-Za-z+/=]+)/);
  if(!m) return false;
  let code;
  try{ code = atob(m[1]); }catch(e){ code = m[1]; }
  if(code.length !== QUESTIONS.length) return false;
  const arr = code.split('').map(c=>parseInt(c,10));
  for(let i=0;i<arr.length;i++){ if(isNaN(arr[i])||arr[i]<0||arr[i]>=QUESTIONS[i].opts.length) return false; }
  state.answers = arr;
  state.screen = "result";
  return true;
}

function render(){
  if(state.screen==="intro") renderIntro();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="name") renderName();
  else renderResult();
}

/* 键盘：1-4 选项，← 上一题 */
document.addEventListener('keydown',(e)=>{
  if(state.screen!=="quiz") return;
  const i = state.qi;
  if(e.key==="ArrowLeft"){ if(i>0){ state.qi--; render(); } return; }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=QUESTIONS[i].opts.length){
    const el = document.querySelectorAll('#main .opt')[n-1];
    if(el) el.click();
  }
});

if(readHash()){ render(); }
else { render(); }
</script>
